services:
  firemail:
    build:
      context: .
    image: firemail:local
    container_name: firemail
    restart: unless-stopped
    stop_signal: SIGINT
    ports:
      # 默认仅绑定本机回环，外网/局域网不可直连；可通过 .env 调整 HOST_BIND/HOST_PORT 或配合隧道/反代暴露
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-11180}:80"
    volumes:
      - ./data:/app/backend/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - HOST=0.0.0.0
      - FLASK_PORT=5000
      - WS_PORT=8765
      - FLASK_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY 环境变量}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:11180,http://127.0.0.1:11180}
      # Outlook OAuth refresh_token 主动保活配置
      - OUTLOOK_TOKEN_KEEPER_ENABLED=${OUTLOOK_TOKEN_KEEPER_ENABLED:-true}
      - OUTLOOK_KEEPER_TICK_SECONDS=${OUTLOOK_KEEPER_TICK_SECONDS:-60}
      - OUTLOOK_KEEPER_CONCURRENCY=${OUTLOOK_KEEPER_CONCURRENCY:-4}
      - OUTLOOK_RT_ROTATE_AFTER_DAYS=${OUTLOOK_RT_ROTATE_AFTER_DAYS:-30}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
