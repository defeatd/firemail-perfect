services:
  firemail:
    build:
      context: .
      # 本机部署只构建当前架构，加快速度
    image: firemail:local
    container_name: firemail
    restart: unless-stopped
    ports:
      # 主机端口:容器端口（容器内 Caddy 监听 80）
      # 修改左侧端口即可，例如 "8080:80"、"11180:80"
      - "80:80"
    volumes:
      - ./data:/app/backend/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - HOST=0.0.0.0
      - FLASK_PORT=5000
      - WS_PORT=8765
      - FLASK_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY 环境变量}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80}
      # Outlook token 自动续期（秒）
      - OUTLOOK_TOKEN_REFRESH_INTERVAL=${OUTLOOK_TOKEN_REFRESH_INTERVAL:-1500}
      - OUTLOOK_TOKEN_RENEW_BEFORE=${OUTLOOK_TOKEN_RENEW_BEFORE:-600}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
